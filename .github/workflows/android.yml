name: Android Build and Release

on:
  push:
    tags: [ 'v*' ] # Triggers on version tags like v1.0, v2.3.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - uses: actions/checkout@v4

      # 2. Set up the Java Development Kit (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Grant execute permission for Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Decode the Base64 keystore from GitHub Secret to a file, and ensure it's readable.
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/my-release-key.jks

      # 5. Test File Existence
      - name: Check File Exists
        run: |
          if [ -f "${{ runner.temp }}/my-release-key.jks" ]; then
            echo "Keystore file found."
          else
            echo "ERROR: Keystore file not found after decoding."
            exit 1
          fi

      # 6. Build the signed release APK
      - name: Build Release APK
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 7. Create a GitHub Release and attach the APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
